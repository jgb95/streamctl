{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>streamctl</title>
<style>
:root {
	--bg: #0f1115;
	--panel: #161922;
	--border: #2a2f3a;
	--text: #e8eaed;
	--muted: #8a93a4;
	--accent: #6ea8fe;
	--danger: #ef6b6b;
	--success: #5dd39e;
	--warn: #f5c267;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	background: var(--bg);
	color: var(--text);
}
header {
	border-bottom: 1px solid var(--border);
	padding: 12px 24px;
	display: flex;
	align-items: center;
	gap: 24px;
}
header h1 { font-size: 16px; margin: 0; }
header nav a {
	color: var(--muted);
	text-decoration: none;
	margin-right: 16px;
}
header nav a:hover { color: var(--text); }
header .right { margin-left: auto; }
main { max-width: 980px; margin: 24px auto; padding: 0 24px; }
h2 { font-size: 18px; margin: 24px 0 12px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
tr:last-child td { border-bottom: none; }
.btn {
	display: inline-block;
	padding: 6px 12px;
	border: 1px solid var(--border);
	background: var(--panel);
	color: var(--text);
	border-radius: 4px;
	text-decoration: none;
	font-size: 13px;
	cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: #0f1115; border-color: var(--accent); }
.btn-danger { color: var(--danger); }
.badge {
	display: inline-block;
	padding: 2px 8px;
	border-radius: 10px;
	font-size: 11px;
	font-weight: 600;
	text-transform: uppercase;
}
.badge-active { background: rgba(93,211,158,0.15); color: var(--success); }
.badge-inactive { background: rgba(138,147,164,0.15); color: var(--muted); }
.badge-failed { background: rgba(239,107,107,0.15); color: var(--danger); }
form { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
.field { margin-bottom: 16px; }
.field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.field input[type=text], .field input[type=password], .field select, .field textarea {
	width: 100%;
	padding: 8px 10px;
	background: var(--bg);
	border: 1px solid var(--border);
	border-radius: 4px;
	color: var(--text);
	font: inherit;
}
.field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.field-inline { display: flex; align-items: center; gap: 8px; }
.field-inline label { margin-bottom: 0; }
.checkboxes { display: flex; flex-direction: column; gap: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.error { background: rgba(239,107,107,0.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px; border-radius: 4px; margin-bottom: 16px; }
.muted { color: var(--muted); }
code { background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
<header>
	<h1>streamctl</h1>
	<nav>
		<a href="/">Streams</a>
		<a href="/endpoints">Endpoints</a>
	</nav>
	<div class="right">
		<a href="/logout" class="btn">Log out</a>
	</div>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
