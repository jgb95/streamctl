{{define "login.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>streamctl login</title>
<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e8eaed; }
.card { background: #161922; border: 1px solid #2a2f3a; border-radius: 6px; padding: 24px; width: 340px; }
h1 { font-size: 18px; margin: 0 0 16px; }
input { width: 100%; padding: 8px 10px; background: #0f1115; border: 1px solid #2a2f3a; border-radius: 4px; color: #e8eaed; font: inherit; box-sizing: border-box; }
button, .oauth { display: block; margin-top: 12px; width: 100%; padding: 10px; background: #f7931a; color: #111; border: none; border-radius: 4px; font: inherit; font-weight: 700; cursor: pointer; box-sizing: border-box; text-align: center; text-decoration: none; }
.oauth:hover { background: #ffad42; }
.break-glass { margin-top: 20px; color: #aeb4c0; }
.break-glass summary { cursor: pointer; }
.hint { color: #aeb4c0; font-size: 13px; margin: -8px 0 14px; }
.error { background: rgba(239,107,107,0.1); border: 1px solid #ef6b6b; color: #ef6b6b; padding: 8px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
	<h1>streamctl</h1>
	<p class="hint">Restricted to Bitcoin++ global administrators.</p>
	{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
	{{if .OAuthEnabled}}<a class="oauth" href="/oauth/start">Continue with Bitcoin++</a>{{end}}
	{{if .BreakGlassEnabled}}
	<details class="break-glass">
		<summary>Emergency access</summary>
		<form method="post" action="/login">
			<input type="password" name="secret" placeholder="Break-glass secret" autocomplete="current-password">
			<button type="submit">Log in with secret</button>
		</form>
	</details>
	{{end}}
</div>
</body>
</html>
{{end}}
